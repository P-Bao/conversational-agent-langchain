services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: conversational-rag-api
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - QDRANT_URL=${QDRANT_URL:-http://qdrant}
      - QDRANT_PORT=${QDRANT_PORT:-6333}
    volumes:
      - hf_cache:/root/.cache/huggingface
    networks:
      - test_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD-SHELL
        - "uv run python -c \"import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/healthz', timeout=5).status == 200 else 1)\""
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  hf_cache:
    name: bge_hf_cache

networks:
  test_network:
    external: true

