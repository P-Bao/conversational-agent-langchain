services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: conversational-rag-api
    restart: unless-stopped
    runtime: nvidia  # enable NVIDIA runtime for GPU
    deploy:
      resources:
        limits:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    ports:
      - "8001:8001"
    env_file:
      - .env
    networks:
      - test_network
    healthcheck:
      test:
        - CMD-SHELL
        - "uv run python -c \"import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/healthz', timeout=5).status == 200 else 1)\""
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  test_network:
    external: true
