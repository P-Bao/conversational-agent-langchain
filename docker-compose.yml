services:
  agent:
    build: .
    platform: linux/amd64
    volumes:
      - ./data:/data
      - ./logs:/logs
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006/v1/traces
    networks:
      - test_network

  streamlit_app:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    platform: linux/amd64
    depends_on:
      - agent
    ports:
      - "8501:8501"
    environment:
      - BACKEND_HOST=agent
    networks:
      - test_network

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - 6006:6006
      - 4317:4317
      - 4318:4318
    environment:
      - PHOENIX_WORKING_DIR=/mnt/data
    volumes:
      - ./phoenix_data:/mnt/data
    networks:
      - test_network

networks:
  test_network:
    external: true
