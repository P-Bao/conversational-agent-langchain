services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: conversational-rag-api
    restart: unless-stopped
    ports:
      - "8005:8005"
    env_file:
      - .env
    environment:
      # OTel tracing: export OTLP/HTTP to the Tempo / OTel Collector in the
      # k8s cluster (confirm the real endpoint with the infra team). Leave
      # unset to disable tracing locally.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=rag-retrieval
    volumes:
      - ./hf-cache:/app/.cache/huggingface
    networks:
      - ami-network
      - ami_net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD-SHELL
        - "uv run python -c \"import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8005/healthz', timeout=5).status == 200 else 1)\""
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  ami-network:
    external: true
  ami_net:
    external: true