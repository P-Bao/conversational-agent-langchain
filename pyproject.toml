[project]
name = "agent"
version = "7.0.0"
description = "Retrieval & Search API — local BGE-reranker-v2-m3, remote BGE-m3 dense embeddings"
authors = [
    { name = "Marc Fabian Mezger", email = "57255687+mfmezger@users.noreply.github.com" }
]
requires-python = ">= 3.10"
readme = "README.md"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "python-dotenv==1.0.1",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "loguru==0.7.3",
    "langchain-core>=1.0",
    "langchain-qdrant>=1.1.0",
    "qdrant-client==1.12.1",
    "httpx==0.28.1",
    "langgraph>=1.2.6",
    "openai>=2.43.0",
    # Pin versions to match embedding-server for GPU compatibility & prepare_for_model support
    "FlagEmbedding==1.4.0",
    "transformers==4.57.1",
    "tokenizers>=0.21,<0.22",
]
[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"


[tool.mypy]
disallow_untyped_defs = true
# disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true

[dependency-groups]
dev = [
    "anyio>=4.14.0",
    "coverage>=7.14.2",
    "dirty-equals>=0.11",
    "inline-snapshot>=0.34.2",
    "pytest-xdist>=3.8.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-recording>=0.13.4",
    "httpx>=0.28.1",
    "deepeval>=4.1.1",
]

[tool.ty.rules]
invalid-argument-type = "warn"
invalid-assignment = "warn"
invalid-return-type = "warn"
invalid-type-form = "warn"
missing-argument = "warn"
missing-typed-dict-key = "warn"
not-iterable = "warn"
unknown-argument = "warn"
unresolved-attribute = "warn"
unresolved-import = "warn"

[tool.coverage.run]
omit = ["tests/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --durations=20"
xfail_strict = true
markers = [
    "unit: pure unit tests",
    "integration: integration tests with in-process dependencies",
    "contract: endpoint contract tests without external network dependencies",
    "e2e: end-to-end tests requiring external services",
    "vcr: tests backed by recorded HTTP interactions",
    "qwen: DeepEval Qwen LLM evaluation tests",
    "slow: long-running tests",
]
filterwarnings = [
    "ignore:`json_encoders` is deprecated:pydantic.warnings.PydanticDeprecatedSince20",
    "ignore:Support for class-based `config` is deprecated:pydantic.warnings.PydanticDeprecatedSince20"
]
