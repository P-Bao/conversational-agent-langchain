#               - key: service.name
#                 value: service_name
#             queries:
#               - name: "requests_rate"
#                 query: "sum(rate(rag_retrieval_requests_total[5m]))"

grafana.ini:
  dashboards:
    default_home_dashboard_path: /tmp/dashboards/rag-retrieval-dashboard.json
