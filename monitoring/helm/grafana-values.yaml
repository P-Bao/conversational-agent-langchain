# Grafana Helm values — deploy dashboard provisioning cho Grafana trung tâm.
#
# Cơ chế: Grafana Helm chart hỗ trợ "dashboard sidecar" — tự động load mọi
# ConfigMap có label `grafana_dashboard=1` trong cluster thành dashboard,
# không cần import tay qua UI mỗi lần thay đổi.
#
# CHÚ Ý (bắt buộc): các giá trị chart/label/namespace dưới đây là giả định
# hợp lý theo pattern kube-prometheus-stack phổ biến — PHẢI xác nhận lại với
# đội hạ tầng / Grafana trung tâm của tổ chức xem họ đang dùng chart nào
# (grafana/grafana hay prometheus-community/kube-prometheus-stack), sidecar
# label nào, trước khi apply. Tránh conflict với cấu hình sẵn có.
#
# Apply: xem Makefile (make dashboard-apply) và monitoring/README.md.

sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    folder: /tmp/dashboards
    provider:
      foldersFromFilesStructure: true

# Datasource provisioning — CHỈ thêm nếu Grafana trung tâm CHƯA có:
# - Prometheus: gần như chắc chắn đã có (kube-prometheus-stack tự provision).
# - Tempo: cần có để xem trace (service "rag-retrieval" trên Tempo).
#
# ⚠️ ĐÃ XÁC NHẬN THÀNH CÔNG QUA UI GRAFANA (Save & Test → "Data source is
# working", uid afy8sa3jsx88wf) với cấu hình sau — block dưới đây khớp 100%
# với cấu hình UI đã test, dùng khi đi đường Helm thay vì UI:
#
# - URL: http://tempo.monitoring.svc.cluster.local:3200 (in-cluster HTTP API
#   port 3200 — KHÔNG phải 4318/OTLP ingestion, KHÔNG phải NodePort).
# - Authentication: No Authentication.
# - Streaming: TẮT cả Search queries + Metrics queries. ⚠️ BÀI HỌC: Tempo
#   HTTP API port 3200 trả về HTTP/1.1 (không serve HTTP/2), gRPC streaming
#   sẽ fail với lỗi "http2: frame too large, note that the frame header
#   looked like an HTTP/1.1 header" — tắt streaming là bắt buộc với Tempo
#   self-host qua NodePort này.
# - Trace to logs: Loki, shift 0/0, tag trace_id=trace_id, filter by trace ID
#   + span ID → nhảy từ span sang dòng log rag_retrieval_output (100% payload).
# - Trace to metrics: Prometheus, shift -2m/+2m, tag service.name=service_name,
#   link "requests_rate" = sum(rate(rag_retrieval_requests_total[5m])).
# datasources:
#   datasources.yaml:
