#             spanEndTimeShift: "0"
#             tags:
#               - key: trace_id
#                 value: trace_id
#             filterByTraceID: true
#             filterBySpanID: true
#           traceToMetrics:
#             datasourceUid: prometheus
#             spanStartTimeShift: "-2m"
#             spanEndTimeShift: "2m"
